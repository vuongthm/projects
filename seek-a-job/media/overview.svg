<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Seek a Job</title>
<desc id="desc">An understated editorial cover with a quiet open doorway, referring to the next step in a job search. </desc>
<style>
:root { color-scheme: light dark; --paper:#F6F3EA; --ink:#283D32; --sub:#617267; --accent:#B46B4B; --arch:#E5E8DA; --inside:#FDFCF6; --door:#C7D2BC; --hair:#C8CEC0; }
@media (prefers-color-scheme: dark) { :root { --paper:#1D2522; --ink:#EAEADF; --sub:#B6C0B3; --accent:#D6A080; --arch:#293730; --inside:#35483B; --door:#607966; --hair:#627369; } }
.bg{fill:var(--paper)} .ink{fill:var(--ink)} .sub{fill:var(--sub)} .fine{stroke:var(--hair);stroke-width:2;fill:none} .forest{stroke:var(--ink);fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.title{font-family:Georgia,'Palatino Linotype','Liberation Serif',serif;font-weight:400;letter-spacing:-7px;fill:var(--ink)}
.sans{font-family:'Inter','Lato',Arial,sans-serif;fill:var(--sub)}
</style>
